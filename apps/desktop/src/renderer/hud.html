<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cooper HUD</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Instrument Sans', system-ui, sans-serif;
      }
      .hud {
        height: 100%;
        display: grid;
        place-items: center;
      }
      .pill {
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(20, 16, 14, 0.92);
        color: #f3e7d7;
        border: 1px solid rgba(196, 129, 74, 0.45);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        animation: pop 180ms cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="hud"><div class="pill" id="msg">Captured</div></div>
    <script>
      const params = new URLSearchParams(location.search)
      const message = params.get('message') || 'Captured'
      document.getElementById('msg').textContent = message
    </script>
  </body>
</html>
